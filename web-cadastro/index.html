<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Abertura de Conta</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <h2>Abertura de Conta</h2>
        <form id="formulario">
            <label for="cpf">CPF:</label>
            <input type="text" id="cpf" maxlength="11" required>

            <label for="dataNascimento">Data de Nascimento:</label>
            <input type="date" id="dataNascimento" required>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" placeholder="11999999999" maxlength="11" required>

            <button type="submit">Enviar</button>
            <p id="mensagemErro" class="erro"></p>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
